<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Mesh gradient background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F0F23" stop-opacity="1"/>
    </radialGradient>

    <!-- Glass highlight -->
    <filter id="glassBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background orb -->
  <circle cx="100" cy="100" r="90" fill="url(#bg)"/>

  <!-- Stylized F letter forming a speech bubble + book -->
  <g transform="translate(60, 50)">
    <!-- Book base -->
    <path d="M30 80 C30 95 40 100 55 100 L45 100 C38 100 30 92 30 80 Z"
          fill="rgba(99,102,241,0.25)" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M30 80 L30 100 L55 100" fill="none" stroke="#8B5CF6" stroke-width="2"/>

    <!-- Speech bubble rising -->
    <path d="M20 60 Q10 50 25 45 Q40 35 55 45 Q70 55 60 70 Q65 85 50 90 L30 85 Q15 85 20 60 Z"
          fill="rgba(245,158,11,0.25)" stroke="#F59E0B" stroke-width="2"/>

    <!-- Accent dot inside bubble -->
    <circle cx="42" cy="58" r="4" fill="#F59E0B"/>
  </g>

  <!-- Glass highlight overlay -->
  <circle cx="100" cy="100" r="85" fill="url(#shimmer)" filter="url(#glassBlur)"/>
</svg>
